[package]
name = "dioxus-lazy"
version = "0.4.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Async list components for Dioxus"
repository = "https://github.com/dioxus-community/dioxus-lazy"

[dependencies]
dioxus = { version = "0.7.10", features = ["web"] }
web-sys = { version = "0.3.72", features = ["Element"] }
futures = "0.3.31"

[dev-dependencies]
console_error_panic_hook = "0.1.7"
dioxus-logger = "0.7.10"
